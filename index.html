<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SoD Conflict Detector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
  :root {
    --bg: #F7F8FA;
    --panel: #FFFFFF;
    --ink: #1B2430;
    --ink-soft: #55616F;
    --border: #D8DCE3;
    --steel: #375475;
    --steel-dark: #24374C;
    --red: #B3261E;
    --red-bg: #FBEAE9;
    --amber: #8A5A00;
    --amber-bg: #FBF1DD;
    --green: #2F6846;
    --green-bg: #E9F3EC;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  #root { min-height: 100vh; }

  .shell { max-width: 1120px; margin: 0 auto; padding: 40px 24px 80px; }

  .masthead { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 2px solid var(--ink); padding-bottom: 18px; margin-bottom: 28px; }
  .masthead h1 { font-size: 26px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .masthead .tag { font-family: var(--mono); font-size: 13px; color: var(--ink-soft); }

  .tabs { display: flex; gap: 28px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
  .tab { padding: 10px 2px 14px; font-size: 15px; font-weight: 600; color: var(--ink-soft); cursor: pointer; border-bottom: 3px solid transparent; background: none; border-top: none; border-left: none; border-right: none; font-family: var(--sans); }
  .tab.active { color: var(--ink); border-bottom-color: var(--steel); }
  .tab:hover:not(.active) { color: var(--ink); }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 24px; margin-bottom: 24px; }
  .panel h2 { font-size: 16px; margin: 0 0 4px; }
  .panel .sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 18px; }

  .upload-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .btn { font-family: var(--sans); font-size: 14px; font-weight: 600; padding: 10px 18px; border-radius: 3px; border: 1px solid var(--ink); background: var(--ink); color: white; cursor: pointer; }
  .btn:hover { background: var(--steel-dark); border-color: var(--steel-dark); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--border); }
  .btn.ghost:hover { border-color: var(--ink); }
  input[type=file] { display: none; }
  .file-status { font-family: var(--mono); font-size: 13px; color: var(--ink-soft); }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 10px 10px; border-bottom: 1px solid #EEF0F3; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .mono { font-family: var(--mono); font-size: 13px; }

  .rule-id { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); }

  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 3px; font-family: var(--sans); }
  .badge.conflict { background: var(--red-bg); color: var(--red); }
  .badge.review { background: var(--amber-bg); color: var(--amber); }
  .badge.remediated { background: var(--green-bg); color: var(--green); }
  .badge.accepted { background: #EDEFF2; color: var(--ink-soft); }

  select.status-select { font-family: var(--sans); font-size: 13px; padding: 6px 8px; border-radius: 3px; border: 1px solid var(--border); background: white; color: var(--ink); }

  .empty { text-align: center; padding: 50px 20px; color: var(--ink-soft); }
  .empty .big { font-size: 15px; margin-bottom: 6px; color: var(--ink); font-weight: 600; }

  .summary-strip { display: flex; gap: 12px; margin-bottom: 24px; }
  .stat { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 16px 18px; }
  .stat .num { font-family: var(--mono); font-size: 26px; font-weight: 600; line-height: 1; }
  .stat .label { font-size: 12px; color: var(--ink-soft); margin-top: 6px; }
  .stat.flag .num { color: var(--red); }

  .rules-ref { font-size: 13px; }
  .rules-ref tr td:first-child { width: 90px; }

  footer { text-align: center; color: var(--ink-soft); font-size: 12px; margin-top: 40px; font-family: var(--mono); }
</style>
</head>
<body>
<div id="root"></div>

<script>
const e = React.createElement;
const { useState, useCallback } = React;

const SOD_RULES = [
  { id: "SOD-01", roleA: "Create Vendor", roleB: "Approve Payment", risk: "A user could create a fictitious vendor and approve payment to it." },
  { id: "SOD-02", roleA: "Initiate Wire Transfer", roleB: "Approve Wire Transfer", risk: "A user could originate and self-approve a fraudulent wire." },
  { id: "SOD-03", roleA: "Modify User Access", roleB: "Approve Access Request", risk: "A user could grant themselves access and approve their own request." },
  { id: "SOD-04", roleA: "Post Journal Entry", roleB: "Approve Journal Entry", risk: "A user could post and self-approve a manual journal entry, bypassing review." },
  { id: "SOD-05", roleA: "Originate Loan", roleB: "Approve Loan", risk: "A user could originate a loan and approve their own underwriting decision." },
  { id: "SOD-06", roleA: "Reconcile Bank Account", roleB: "Post Journal Entry", risk: "A user could post an entry and then reconcile it themselves, concealing errors or fraud." },
];

const SAMPLE_CSV = "UserName,DisplayName,Role\n" +
  "jdoe,Jane Doe,Create Vendor\n" +
  "jdoe,Jane Doe,Approve Payment\n" +
  "mlee,Mark Lee,Initiate Wire Transfer\n" +
  "mlee,Mark Lee,Approve Wire Transfer\n" +
  "ksmith,Karen Smith,Post Journal Entry\n" +
  "ksmith,Karen Smith,Reconcile Bank Account\n" +
  "tbrown,Tom Brown,Originate Loan\n" +
  "rwhite,Rachel White,Approve Loan\n" +
  "avance,Amy Vance,Modify User Access\n" +
  "avance,Amy Vance,Approve Access Request\n" +
  "dgreen,Dan Green,Create Vendor\n";

function parseCSV(text) {
  const result = Papa.parse(text.trim(), { header: true, skipEmptyLines: true });
  return result.data;
}

function buildUserRoleMap(rows) {
  const map = {};
  rows.forEach(function (r) {
    const user = (r.UserName || "").trim();
    if (!user) return;
    if (!map[user]) map[user] = { displayName: (r.DisplayName || user).trim(), roles: new Set() };
    if (r.Role) map[user].roles.add(r.Role.trim());
  });
  return map;
}

function detectConflicts(userMap) {
  const findings = [];
  Object.keys(userMap).forEach(function (userName) {
    const info = userMap[userName];
    SOD_RULES.forEach(function (rule) {
      if (info.roles.has(rule.roleA) && info.roles.has(rule.roleB)) {
        findings.push({
          key: userName + "__" + rule.id,
          userName: userName, displayName: info.displayName,
          ruleId: rule.id, roleA: rule.roleA, roleB: rule.roleB, risk: rule.risk,
          status: "Needs Review",
        });
      }
    });
  });
  return findings;
}

function Masthead() {
  return e("div", { className: "masthead" },
    e("h1", null, "SoD Conflict Detector"),
    e("span", { className: "tag" }, "NIST 800-53 AC-5 \u00B7 Access Certification Workbench")
  );
}

function RulesReference() {
  return e("div", { className: "panel" },
    e("h2", null, "Segregation of Duties Rule Set"),
    e("p", { className: "sub" }, "Toxic access combinations checked against every uploaded user."),
    e("table", { className: "rules-ref" },
      e("thead", null, e("tr", null, e("th", null, "Rule"), e("th", null, "Combination"), e("th", null, "Risk"))),
      e("tbody", null, SOD_RULES.map(function (r) {
        return e("tr", { key: r.id },
          e("td", { className: "rule-id" }, r.id),
          e("td", null, r.roleA, " ", e("span", { style: { color: "#9AA5B1" } }, "+"), " ", r.roleB),
          e("td", { style: { color: "var(--ink-soft)" } }, r.risk)
        );
      }))
    )
  );
}

function UploadPanel(props) {
  const handleFile = useCallback(function (evt) {
    const file = evt.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (ev) { props.onData(ev.target.result, file.name); };
    reader.readAsText(file);
  }, [props.onData]);

  const loadSample = function () { props.onData(SAMPLE_CSV, "sample-data.csv"); };

  return e("div", { className: "panel" },
    e("h2", null, "Upload Access Data"),
    e("p", { className: "sub" }, "CSV columns: UserName, DisplayName, Role (one row per role assignment)."),
    e("div", { className: "upload-row" },
      e("label", { className: "btn", htmlFor: "csv-input" }, "Upload CSV"),
      e("input", { id: "csv-input", type: "file", accept: ".csv", onChange: handleFile }),
      e("button", { className: "btn ghost", onClick: loadSample }, "Load sample data"),
      props.fileName ? e("span", { className: "file-status" }, "Loaded: " + props.fileName) : null
    )
  );
}

function SummaryStrip(props) {
  const findings = props.findings;
  const flagged = new Set(findings.map(function (f) { return f.userName; })).size;
  const open = findings.filter(function (f) { return f.status === "Needs Review"; }).length;
  return e("div", { className: "summary-strip" },
    e("div", { className: "stat" }, e("div", { className: "num" }, props.userCount), e("div", { className: "label" }, "Users Tested")),
    e("div", { className: "stat flag" }, e("div", { className: "num" }, findings.length), e("div", { className: "label" }, "Conflicts Found")),
    e("div", { className: "stat" }, e("div", { className: "num" }, flagged), e("div", { className: "label" }, "Users Flagged")),
    e("div", { className: "stat" }, e("div", { className: "num" }, open), e("div", { className: "label" }, "Open (Needs Review)"))
  );
}

function DetectorResults(props) {
  const findings = props.findings;
  if (findings.length === 0) {
    return e("div", { className: "panel" },
      e("div", { className: "empty" },
        e("div", { className: "big" }, "No conflicts detected"),
        e("div", null, "Every uploaded user was tested against all " + SOD_RULES.length + " rules with no matches.")
      )
    );
  }
  return e("div", { className: "panel" },
    e("h2", null, "Detected Conflicts"),
    e("p", { className: "sub" }, "Flagged combinations requiring review or remediation."),
    e("table", null,
      e("thead", null, e("tr", null, e("th", null, "User"), e("th", null, "Rule"), e("th", null, "Conflicting Access"), e("th", null, "Business Risk"))),
      e("tbody", null, findings.map(function (f) {
        return e("tr", { key: f.key },
          e("td", null, f.displayName, e("div", { className: "mono", style: { color: "var(--ink-soft)" } }, f.userName)),
          e("td", { className: "rule-id" }, f.ruleId),
          e("td", null, f.roleA, e("br"), e("span", { style: { color: "#9AA5B1" } }, "+"), " ", f.roleB),
          e("td", { style: { color: "var(--ink-soft)" } }, f.risk)
        );
      }))
    )
  );
}

function CertificationTab(props) {
  const findings = props.findings;
  if (findings.length === 0) {
    return e("div", { className: "panel" },
      e("div", { className: "empty" },
        e("div", { className: "big" }, "Nothing to certify"),
        e("div", null, "Run the detector on the Conflict Detector tab first.")
      )
    );
  }

  const badgeClass = { "Needs Review": "review", "Remediated": "remediated", "Accepted Risk": "accepted" };

  return e("div", { className: "panel" },
    e("h2", null, "User Access Certification"),
    e("p", { className: "sub" }, "Reviewer disposition for each flagged conflict. This is the sign-off record for the control."),
    e("table", null,
      e("thead", null, e("tr", null, e("th", null, "User"), e("th", null, "Rule"), e("th", null, "Status"), e("th", null, "Set Disposition"))),
      e("tbody", null, findings.map(function (f) {
        return e("tr", { key: f.key },
          e("td", null, f.displayName, e("div", { className: "mono", style: { color: "var(--ink-soft)" } }, f.userName)),
          e("td", { className: "rule-id" }, f.ruleId),
          e("td", null, e("span", { className: "badge " + badgeClass[f.status] }, f.status)),
          e("td", null, e("select", {
            className: "status-select",
            value: f.status,
            onChange: function (ev) { props.onStatusChange(f.key, ev.target.value); }
          },
            e("option", null, "Needs Review"),
            e("option", null, "Remediated"),
            e("option", null, "Accepted Risk")
          ))
        );
      }))
    )
  );
}

function App() {
  const [tab, setTab] = useState("detector");
  const [fileName, setFileName] = useState(null);
  const [userMap, setUserMap] = useState({});
  const [findings, setFindings] = useState([]);

  const handleData = useCallback(function (text, name) {
    const rows = parseCSV(text);
    const map = buildUserRoleMap(rows);
    const results = detectConflicts(map);
    setUserMap(map);
    setFindings(results);
    setFileName(name);
  }, []);

  const handleStatusChange = useCallback(function (key, status) {
    setFindings(function (prev) {
      return prev.map(function (f) { return f.key === key ? Object.assign({}, f, { status: status }) : f; });
    });
  }, []);

  const userCount = Object.keys(userMap).length;

  const children = [
    e(Masthead, { key: "masthead" }),
    e("div", { className: "tabs", key: "tabs" },
      e("button", { className: "tab " + (tab === "detector" ? "active" : ""), onClick: function () { setTab("detector"); } }, "Conflict Detector"),
      e("button", { className: "tab " + (tab === "cert" ? "active" : ""), onClick: function () { setTab("cert"); } }, "Access Certification")
    ),
  ];

  if (tab === "detector") {
    children.push(e(UploadPanel, { key: "upload", onData: handleData, fileName: fileName }));
    if (userCount > 0) children.push(e(SummaryStrip, { key: "summary", findings: findings, userCount: userCount }));
    children.push(e(RulesReference, { key: "rules" }));
    if (userCount > 0) children.push(e(DetectorResults, { key: "results", findings: findings }));
  } else {
    children.push(e(CertificationTab, { key: "cert", findings: findings, onStatusChange: handleStatusChange }));
  }

  children.push(e("footer", { key: "footer" }, "SoD Conflict Detector \u00B7 Built by Christopher Ashley \u00B7 Portfolio Exercise"));

  return e("div", { className: "shell" }, children);
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(e(App));
</script>
</body>
</html>
